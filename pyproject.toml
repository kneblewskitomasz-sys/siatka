[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siatka"
version = "0.1.0"
description = "Deterministyczny filtr bezpieczeństwa treści dla tekstu po polsku (kryzys, przemoc, nagłe stany medyczne, treści dla dzieci)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "NeuroMentor" },
]
keywords = ["safety", "crisis", "polish", "filter", "child-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Filters",
]

# ZERO zależności zewnętrznych — celowo. Pakiet ma działać w czystym
# środowisku (offline, bez modeli AI, bez GUI), więc nie ma sekcji
# dependencies, a jedyne importy to `re` i `typing` ze standardowej biblioteki.

[tool.setuptools]
packages = ["siatka"]

[tool.setuptools.package-data]
siatka = ["py.typed"]
